<style>

    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#f97316;--green:#22c55e;;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;user-select:none;}
    a{text-decoration:none;color:inherit;}
    .wrap{max-width:600px;margin:0 auto;padding:50px 20px 80px;}
    .back{display:inline-block;margin-bottom:24px;font-size:14px;color:var(--sub);}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    h1{font-size:36px;font-weight:800;}
    .stats{display:flex;gap:10px;}
    .stat-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 16px;text-align:center;min-width:70px;}
    .stat-label{font-size:10px;text-transform:uppercase;color:var(--sub);}
    .stat-val{font-size:20px;font-weight:700;}
    .controls{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;align-items:center;}
    .btn{padding:9px 20px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:opacity 0.15s;}
    .btn:hover{opacity:0.85;}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--sub);}
    .btn.ghost.active{border-color:var(--accent);color:var(--accent);}
    .ad-banner{margin:24px 0;text-align:center;min-height:90px}
    .arena{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 auto;max-width:400px;}
    .hole{aspect-ratio:1;background:#0d1526;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;cursor:pointer;transition:background 0.1s,transform 0.1s;position:relative;overflow:hidden;}
    .hole:hover{background:#131f36;}
    .hole.active{background:#1a2e50;}
    .hole .mole{transition:transform 0.15s;transform:translateY(100%);font-size:52px;line-height:1;}
    .hole.up .mole{transform:translateY(0);}
    .hole.bonk .mole{transform:scale(0.6) translateY(60%);}
    .score-pop{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;color:var(--green);pointer-events:none;opacity:0;transition:opacity 0.1s;}
    .score-pop.show{opacity:1;}
    .status-bar{text-align:center;margin-top:18px;font-size:16px;color:var(--sub);min-height:28px;}
    .result-msg{text-align:center;margin-top:20px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;display:none;}
    .result-msg h2{font-size:28px;margin-bottom:8px;}
    .result-msg p{color:var(--sub);margin-bottom:16px;}
    .seo{margin-top:60px;}
    .seo h2{font-size:20px;margin-bottom:10px;}
    .seo p{font-size:14px;color:var(--sub);line-height:1.8;}
    footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:60px;text-align:center;font-size:13px;color:var(--sub);border-top:1px solid var(--border);}

    /* ==================== 移动端优化 ==================== */

    /* 平板和手机 (≤768px) */

      /* 容器布局优化 */

        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }

        font-size: 28px !important;
        line-height: 1.3 !important;

        margin-top: 36px !important;

      }

      }

      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }

      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }

      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }

      li {
        margin-bottom: 6px !important;
      }

      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }

      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }

      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }

      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }

      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }

      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }

      .grid {
        gap: 8px !important;
      }

      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }

      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }

      .score-val {
        font-size: 18px !important;
      }

      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }

      .age-value {
        font-size: 24px !important;
      }

      .age-label {
        font-size: 11px !important;
      }

      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }

      .faq-item {
        margin-bottom: 20px !important;
      }

      .faq-item strong {
        font-size: 15px !important;
      }
    }

    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }

      h2 {
        font-size: 18px !important;
      }

      .container, .wrap {
        padding: 32px 12px 60px !important;
      }

      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }

      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }

      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }

    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }

      input, select, textarea {
        font-size: 16px !important;
      }
