<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Memory Test</title>
  <meta name="description" content="Play Memory Test free online. Test and improve your memory with this fun card matching game. Works in your browser.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://knexio.xyz/games/memory-test/" />
  <meta property="og:title" content="Memory Test" />
  <meta property="og:description" content="Memory Test - Free online tool on Knexio" />
  <meta property="og:url" content="https://knexio.xyz/games/memory-test/" />
  <meta property="og:type" content="Game" />
  <meta property="og:site_name" content="Knexio" />
  <meta property="og:image" content="https://knexio.xyz/og-image.png" />
<style>
    :root {
      --bg-dark: #0b1220;
      --bg-dark-2: #070d1a;
      --panel: #111a2e;
      --border: rgba(255,255,255,0.08);
      --text-main: #ffffff;
      --text-sub: #aab3c5;
      --accent: #4f8cff;
      --tile-bg: #1a2336;
      --tile-hover: #233448;

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-dark), var(--bg-dark-2));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .back { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; display: inline-block; }

    h1 { font-size: 32px; margin: 0 0 24px; text-align: center; }

    .intro {
      font-size: 16px; color: var(--text-sub); line-height: 1.7; margin-bottom: 32px;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79,140,255,0.3);
    }

    .info-bar {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 18px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-item span {
      color: var(--text-sub);
      font-size: 14px;
    }
    .info-value {
      color: var(--accent);
      font-weight: 600;
      min-width: 60px;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .message {
      font-size: 20px;
      color: var(--text-main);
      margin-bottom: 24px;
      height: 30px;
    }

    .grid { margin: 0 auto;
      display: inline-grid;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .tile {
      width: 80px;
      height: 80px;
      background: var(--tile-bg);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tile:hover { background: var(--tile-hover); }
    .tile.active { background: var(--accent); box-shadow: 0 0 20px rgba(79,140,255,0.5); }
    .tile.disabled { opacity: 0.5; cursor: default; }
    .tile.disabled:hover { background: var(--tile-bg); }

    @media (max-width: 600px) {
      .tile { width: 60px; height: 60px; }
      .grid { margin: 0 auto; padding: 16px; }
    }

    .ad-top { margin: 0 0 32px; text-align: center; min-height: 90px; }
    .ad-mid  { margin: 40px 0; text-align: center; min-height: 250px; }

    footer {
      font-size: 13px; text-align: center;
      color: var(--text-sub); border-top: 1px solid var(--border); padding-top: 30px;
    }
    footer a { color: var(--accent); }
  .ad-banner{margin:24px 0;text-align:center;min-height:90px}
  
    /* ==================== 移动端优化 ==================== */
    
    /* 平板和手机 (≤768px) */
    @media (max-width: 768px) {
      /* 容器布局优化 */
      .container, .wrap {
        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }
      
      /* 标题字体优化 */
      h1 {
        font-size: 28px !important;
        line-height: 1.3 !important;
      }
      
      h2 {
        font-size: 20px !important;
        margin-top: 36px !important;
        margin-bottom: 10px !important;
      }
      
      h3 {
        font-size: 17px !important;
      }
      
      /* 正文内容优化 */
      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      
      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }
      
      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }
      
      li {
        margin-bottom: 6px !important;
      }
      
      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }
      
      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }
      
      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }
      
      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      
      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }
      
      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }
      
      .grid { margin: 0 auto;
        gap: 8px !important;
      }
      
      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }
      
      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }
      
      .score-val {
        font-size: 18px !important;
      }
      
      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }
      
      .age-value {
        font-size: 24px !important;
      }
      
      .age-label {
        font-size: 11px !important;
      }
      
      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }
      
      .faq-item {
        margin-bottom: 20px !important;
      }
      
      .faq-item strong {
        font-size: 15px !important;
      }
    }
    
    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .container, .wrap {
        padding: 32px 12px 60px !important;
      }
      
      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }
      
      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }
      
      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    }
    </style>
