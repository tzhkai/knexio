<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doodle Jump</title>
  <meta name="description" content="Play Doodle Jump free online. Guide your doodle upward by jumping on platforms. Fun and addictive browser game.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://knexio.xyz/games/doodle-jump/" />
  <meta property="og:title" content="Doodle Jump" />
  <meta property="og:description" content="Doodle Jump - Free online tool on Knexio" />
  <meta property="og:url" content="https://knexio.xyz/games/doodle-jump/" />
  <meta property="og:type" content="Game" />
  <meta property="og:site_name" content="Knexio" />
  <meta property="og:image" content="https://knexio.xyz/og-image.png" />
<style>
    :root { --bg: #0b1220; --panel: #111a2e; --accent: #4f8cff; --text: #fff; --sub: #aab3c5;; --text-main: #fff; --text-sub: #aab3c5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
    .back { display: block; text-align: left; color: var(--sub); margin-bottom: 20px; text-decoration: none; }
    h1 { font-size: 32px; margin-bottom: 10px; }
    .game-container { background: var(--panel); border-radius: 16px; padding: 20px; margin: 20px 0; }
    canvas { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); border-radius: 12px; max-width: 100%; }
    .controls { margin-top: 20px; color: var(--sub); font-size: 14px; }
    .score { font-size: 24px; color: var(--accent); margin: 10px 0; }
    .btn { padding: 12px 30px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    footer { margin-top: 40px; font-size: 13px; color: var(--sub); text-align: center;border-top:1px solid var(--border);}
    footer a { color: var(--accent); }
  .ad-banner{margin:24px 0;text-align:center;min-height:90px}
  
    /* ==================== 移动端优化 ==================== */
    
    /* 平板和手机 (≤768px) */
    @media (max-width: 768px) {
      /* 容器布局优化 */
      .container, .wrap {
        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }
      
      /* 标题字体优化 */
      h1 {
        font-size: 28px !important;
        line-height: 1.3 !important;
      }
      
      h2 {
        font-size: 20px !important;
        margin-top: 36px !important;
        margin-bottom: 10px !important;
      }
      
      h3 {
        font-size: 17px !important;
      }
      
      /* 正文内容优化 */
      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      
      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }
      
      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }
      
      li {
        margin-bottom: 6px !important;
      }
      
      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }
      
      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }
      
      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }
      
      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      
      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }
      
      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }
      
      .grid {
        gap: 8px !important;
      }
      
      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }
      
      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }
      
      .score-val {
        font-size: 18px !important;
      }
      
      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }
      
      .age-value {
        font-size: 24px !important;
      }
      
      .age-label {
        font-size: 11px !important;
      }
      
      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }
      
      .faq-item {
        margin-bottom: 20px !important;
      }
      
      .faq-item strong {
        font-size: 15px !important;
      }
    }
    
    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .container, .wrap {
        padding: 32px 12px 60px !important;
      }
      
      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }
      
      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }
      
      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    }
    </style>
</div>
