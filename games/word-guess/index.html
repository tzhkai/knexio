<style>

    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#4f8cff;--green:#22c55e;--yellow:#eab308;--gray:#374151;;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    .wrap{max-width:480px;margin:0 auto;padding:50px 20px 80px;}
    .back{display:inline-block;margin-bottom:24px;font-size:14px;color:var(--sub);}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    h1{font-size:32px;font-weight:800;}
    .streak{font-size:13px;color:var(--sub);}
    .ad-banner{margin:24px 0;text-align:center;min-height:90px}
    #board{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:20px;}
    .row{display:flex;gap:6px;}
    .tile{width:56px;height:56px;border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;text-transform:uppercase;transition:background 0.3s,border-color 0.3s,transform 0.1s;background:transparent;}
    .tile.filled{border-color:var(--sub);transform:scale(1.05);}
    .tile.correct{background:var(--green);border-color:var(--green);color:#fff;}
    .tile.present{background:var(--yellow);border-color:var(--yellow);color:#000;}
    .tile.absent{background:var(--gray);border-color:var(--gray);color:#fff;}
    .tile.shake{animation:shake 0.3s;}
    .tile.flip{animation:flip 0.5s;}
    .keyboard{display:flex;flex-direction:column;gap:6px;align-items:center;}
    .kb-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
    .key{width:36px;height:46px;border-radius:6px;background:#1e2a40;border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-transform:uppercase;transition:background 0.2s;display:flex;align-items:center;justify-content:center;}
    .key.wide{width:56px;font-size:11px;}
    .key:hover{background:#2a3a58;}
    .key.correct{background:var(--green);}
    .key.present{background:var(--yellow);color:#000;}
    .key.absent{background:var(--gray);}
    .msg{text-align:center;font-size:15px;font-weight:500;min-height:28px;margin-bottom:10px;color:var(--sub);}
    .msg.win{color:var(--green);}
    .msg.lose{color:#ef4444;}
    .result-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center;display:none;margin-bottom:20px;}
    .result-panel h2{font-size:24px;margin-bottom:8px;}
    .result-panel .answer{font-size:18px;color:var(--sub);margin-bottom:16px;letter-spacing:2px;font-weight:700;text-transform:uppercase;}
    .result-panel .answer span{color:var(--text);}
    .play-btn{padding:10px 24px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:opacity 0.15s;}
    .play-btn:hover{opacity:0.85;}
    .legend{display:flex;gap:16px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
    .leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);}
    .leg-box{width:20px;height:20px;border-radius:4px;}
    .seo{margin-top:60px;}
    .seo h2{font-size:20px;margin-bottom:10px;}
    .seo p{font-size:14px;color:var(--sub);line-height:1.8;}
    footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:60px;text-align:center;font-size:13px;color:var(--sub);border-top:1px solid var(--border);}
