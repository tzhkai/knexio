<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Flood</title>
  <meta name="description" content="Fill the entire board with one color. Start from the top-left, pick a color to expand your region. Fewest moves wins." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://knexio.xyz/games/color-flood/" />
  <meta property="og:title" content="Color Flood" />
  <meta property="og:description" content="Fill the entire board with one color. Start from the top-left, pick a color to expand your region. Fewest moves wins." />
  <meta property="og:url" content="https://knexio.xyz/games/color-flood/" />
  <meta property="og:type" content="Game" />
  <meta property="og:site_name" content="Knexio" />
  <meta property="og:image" content="https://knexio.xyz/og-image.png" />
<style>
    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#4f8cff;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
    .wrap{max-width:600px;margin:0 auto;padding:28px 20px 80px;text-align:center}
    .back{display:inline-block;margin-bottom:20px;color:var(--sub);font-size:14px;float:left}
    h1{font-size:28px;margin-bottom:6px;clear:both}
    .subtitle{color:var(--sub);font-size:14px;margin-bottom:16px}
    .ad-slot{margin:14px 0;text-align:center}
    .diff-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
    .diff-btn{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:13px;cursor:pointer;transition:.15s}
    .diff-btn.active,.diff-btn:hover{border-color:var(--accent);color:var(--accent)}
    .stats-row{display:flex;gap:16px;justify-content:center;margin-bottom:12px;font-size:14px;color:var(--sub)}
    .stats-row strong{color:var(--text)}
    #boardCanvas{border:2px solid var(--border);border-radius:8px;cursor:pointer;touch-action:none}
    .color-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
    .color-btn{width:44px;height:44px;border-radius:10px;border:3px solid transparent;cursor:pointer;transition:transform .1s,border-color .15s}
    .color-btn:hover{transform:scale(1.15)}
    .color-btn.selected{border-color:#fff}
    .result-msg{margin-top:14px;font-size:16px;font-weight:600;min-height:24px}
    .result-msg.win{color:#34d399}
    .result-msg.lose{color:#f87171}
    .btn{padding:9px 24px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s;margin-top:12px}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
    footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:40px;text-align:center;font-size:13px;color:var(--sub);border-top:1px solid var(--border);}
  .ad-banner{margin:24px 0;text-align:center;min-height:90px}
  
    /* ==================== 移动端优化 ==================== */
    
    /* 平板和手机 (≤768px) */
    @media (max-width: 768px) {
      /* 容器布局优化 */
      .container, .wrap {
        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }
      
      /* 标题字体优化 */
      h1 {
        font-size: 28px !important;
        line-height: 1.3 !important;
      }
      
      h2 {
        font-size: 20px !important;
        margin-top: 36px !important;
        margin-bottom: 10px !important;
      }
      
      h3 {
        font-size: 17px !important;
      }
      
      /* 正文内容优化 */
      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      
      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }
      
      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }
      
      li {
        margin-bottom: 6px !important;
      }
      
      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }
      
      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }
      
      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }
      
      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      
      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }
      
      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }
      
      .grid {
        gap: 8px !important;
      }
      
      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }
      
      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }
      
      .score-val {
        font-size: 18px !important;
      }
      
      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }
      
      .age-value {
        font-size: 24px !important;
      }
      
      .age-label {
        font-size: 11px !important;
      }
      
      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }
      
      .faq-item {
        margin-bottom: 20px !important;
      }
      
      .faq-item strong {
        font-size: 15px !important;
      }
    }
    
    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .container, .wrap {
        padding: 32px 12px 60px !important;
      }
      
      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }
      
      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }
      
      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    }
    </style>
</div>


<script src="/knexio-bundle.js"></script>

      <p>Free online games to play anytime. Enjoy classic games, puzzles, and entertainment.</p>

    </footer>
</body>
