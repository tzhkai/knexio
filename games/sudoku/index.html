<style>

    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#4f8cff;--green:#34d399;--red:#f87171;--given:#e2e8f0;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
    .wrap{max-width:700px;margin:0 auto;padding:28px 16px 80px;text-align:center}
    .back{display:inline-block;margin-bottom:20px;color:var(--sub);font-size:14px;float:left}
    .clearfix::after{content:'';display:table;clear:both}
    h1{font-size:30px;margin-bottom:6px}
    .subtitle{color:var(--sub);font-size:14px;margin-bottom:18px}
    .ad-slot{margin:14px 0}
    .diff-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
    .diff-btn{padding:8px 20px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:13px;font-weight:600}
    .diff-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .meta-bar{display:flex;justify-content:center;gap:24px;margin-bottom:16px}
    .meta-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 20px;font-size:13px}
    .meta-item span{font-weight:700;color:var(--text)}
    #timer{color:var(--yellow,#fbbf24)}
    .board{display:inline-grid;grid-template-columns:repeat(9,1fr);gap:1px;background:#1a2a45;border:3px solid #2a3f60;border-radius:12px;overflow:hidden;margin-bottom:16px}
    .cell{width:52px;height:52px;background:#111a2e;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;cursor:pointer;transition:background .1s;position:relative;border:none;outline:none}
    .cell.given{color:var(--given)}
    .cell.user{color:var(--accent)}
    .cell.selected{background:rgba(79,140,255,.25)!important}
    .cell.highlight{background:rgba(79,140,255,.08)}
    .cell.conflict{color:var(--red)!important;background:rgba(248,113,113,.15)!important}
    .cell.correct{color:var(--green)!important}
    .cell.box-right{border-right:2px solid #2a3f60}
    .cell.box-bottom{border-bottom:2px solid #2a3f60}
    .numpad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
    .num-btn{width:50px;height:50px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;font-weight:700;cursor:pointer;transition:background .1s}
    .num-btn:hover{background:rgba(79,140,255,.2)}
    .num-btn.erase{font-size:14px;color:var(--sub)}
    .action-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
    .btn{padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;background:var(--accent);color:#fff}
    .btn:hover{opacity:.85}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--sub)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
    .hints-left{font-size:13px;color:var(--sub)}
    .win-banner{background:var(--panel);border:1px solid rgba(52,211,153,.4);border-radius:14px;padding:28px;display:none;margin-bottom:16px}
    .win-banner h2{font-size:24px;color:var(--green);margin-bottom:8px}
    .win-banner p{color:var(--sub);margin-bottom:16px}
    footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:60px;font-size:13px;color:var(--sub);text-align:center;border-top:1px solid var(--border);}
  .ad-banner{margin:24px 0;text-align:center;min-height:90px}

    /* ==================== 移动端优化 ==================== */

      }

      /* 段落间距优化 */

        margin-bottom: 16px !important;

      }

      /* 按钮和输入框优化 */
      .btn {

        min-height: 48px !important;
      }

      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }

      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }

      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }

      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }

      .grid { margin: 0 auto;
        gap: 8px !important;
      }

      .cell {
        font-size: 20px !important;

      }

      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }

      .score-val {
        font-size: 18px !important;
      }

      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }

      .age-value {
        font-size: 24px !important;
      }

      .age-label {
        font-size: 11px !important;
      }

      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }

      .faq-item {
        margin-bottom: 20px !important;
      }

      .faq-item strong {
        font-size: 15px !important;
      }
    }

    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }

      h2 {
        font-size: 18px !important;
      }

      .container, .wrap {
        padding: 32px 12px 60px !important;
      }

      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }

      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }

      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }

    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }

      input, select, textarea {
        font-size: 16px !important;
      }
        }
