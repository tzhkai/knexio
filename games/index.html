<script>
function doSearch() {
  var searchTerm = document.getElementById("searchgames").value.toLowerCase().trim();
  var cards = document.querySelectorAll(".grid > a.card, .grid > .card, .nav-card");
  var found = 0;
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var title = card.querySelector("h2, h3");
    var desc = card.querySelector("p");
    var tag = card.querySelector(".tag");
    var titleText = title ? title.textContent.toLowerCase() : "";
    var descText = desc ? desc.textContent.toLowerCase() : "";
    var tagText = tag ? tag.textContent.toLowerCase() : "";
    if (searchTerm === "" || titleText.indexOf(searchTerm) !== -1 || descText.indexOf(searchTerm) !== -1 || tagText.indexOf(searchTerm) !== -1) {
      card.style.display = "";
      if (searchTerm !== "") found++;
    } else {
      card.style.display = "none";
    }
  }
}
document.getElementById("searchgames").addEventListener("keyup", function(e) {
  if (e.key === "Enter") doSearch();
});
</script>
