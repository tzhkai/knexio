<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Breakout</title>
  <meta name="description" content="Play Breakout free online. Move the paddle to bounce the ball and destroy all bricks. Classic arcade game in your browser.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://knexio.xyz/games/breakout/" />
  <meta property="og:title" content="Breakout" />
  <meta property="og:description" content="Move the paddle to bounce the ball · destroy all bricks to win" />
  <meta property="og:url" content="https://knexio.xyz/games/breakout/" />
  <meta property="og:type" content="Game" />
  <meta property="og:site_name" content="Knexio" />
  <meta property="og:image" content="https://knexio.xyz/og-image.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Breakout",
    "description": "Play Breakout free online. Move the paddle to bounce the ball and destroy all bricks. Classic arcade game in your browser.",
    "url": "https://knexio.xyz/games/breakout/",
    "publisher": { "@type": "Organization", "name": "Knexio" }
  }
  </script>
<style>
    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#4f8cff;;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    .wrap{max-width:560px;margin:0 auto;padding:40px 16px 100px;}
    .back{display:inline-block;margin-bottom:18px;font-size:14px;color:var(--sub);}
    .back:hover{color:var(--accent);}
    h1{font-size:28px;margin-bottom:4px;text-align:center;}
    .subtitle{font-size:14px;color:var(--sub);margin-bottom:18px;text-align:center;}

    .ad-banner{margin:24px 0;text-align:center;min-height:90px}

    .hud{display:flex;justify-content:space-between;padding:0 4px;margin-bottom:12px;}
    .hud-stat{text-align:center;}
    .hud-val{font-size:24px;font-weight:800;color:var(--accent);}
    .hud-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.4px;}

    canvas{display:block;margin:0 auto;border-radius:14px;border:2px solid var(--border);cursor:none;touch-action:none;}

    .controls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
    .btn{padding:10px 22px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-outline{background:var(--panel);border:1px solid var(--border);color:var(--sub);}
    .btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
    .btn:hover{opacity:0.85;}

    .diff-row{display:flex;gap:8px;justify-content:center;margin-top:12px;}
    .diff-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--sub);font-size:13px;cursor:pointer;}
    .diff-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

    .ad-mid{margin:24px 0;text-align:center;min-height:90px}
    footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:60px;text-align:center;font-size:13px;color:var(--sub);border-top:1px solid var(--border);}
    footer a{color:var(--sub);margin:0 8px;}footer a:hover{color:var(--accent);}
  
    /* ==================== 移动端优化 ==================== */
    
    /* 平板和手机 (≤768px) */
    @media (max-width: 768px) {
      /* 容器布局优化 */
      .container, .wrap {
        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }
      
      /* 标题字体优化 */
      h1 {
        font-size: 28px !important;
        line-height: 1.3 !important;
      }
      
      h2 {
        font-size: 20px !important;
        margin-top: 36px !important;
        margin-bottom: 10px !important;
      }
      
      h3 {
        font-size: 17px !important;
      }
      
      /* 正文内容优化 */
      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      
      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }
      
      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }
      
      li {
        margin-bottom: 6px !important;
      }
      
      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }
      
      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }
      
      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }
      
      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      
      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }
      
      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }
      
      .grid {
        gap: 8px !important;
      }
      
      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }
      
      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }
      
      .score-val {
        font-size: 18px !important;
      }
      
      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }
      
      .age-value {
        font-size: 24px !important;
      }
      
      .age-label {
        font-size: 11px !important;
      }
      
      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }
      
      .faq-item {
        margin-bottom: 20px !important;
      }
      
      .faq-item strong {
        font-size: 15px !important;
      }
    }
    
    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .container, .wrap {
        padding: 32px 12px 60px !important;
      }
      
      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }
      
      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }
      
      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    }
    </style>
</div>


<script src="/knexio-bundle.js"></script>
  
    <footer>
      <p>Free online games to play anytime. Enjoy classic games, puzzles, and entertainment.</p>
      <p style="margin: 8px 0; font-size: 13px;">
        <a href="/about/" style="color: var(--accent); text-decoration: none; margin: 0 8px;">About</a>
        <a href="/privacy/" style="color: var(--accent); text-decoration: none; margin: 0 8px;">Privacy</a>
        <a href="/terms/" style="color: var(--accent); text-decoration: none; margin: 0 8px;">Terms</a>
        <a href="/contact/" style="color: var(--accent); text-decoration: none; margin: 0 8px;">Contact</a>
      </p>
      <p>© 2026 Knexio. All rights reserved.</p>
    </footer>
</body>
</html>
