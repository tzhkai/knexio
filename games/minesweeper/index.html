<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minesweeper</title>
  <meta name="description" content="Play Minesweeper free online. Classic puzzle game - click cells, avoid mines, clear the board. Works in your browser.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://knexio.xyz/games/minesweeper/" />
  <meta property="og:title" content="Minesweeper" />
  <meta property="og:description" content="Minesweeper - Free online tool on Knexio" />
  <meta property="og:url" content="https://knexio.xyz/games/minesweeper/" />
  <meta property="og:type" content="Game" />
  <meta property="og:site_name" content="Knexio" />
  <meta property="og:image" content="https://knexio.xyz/og-image.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Minesweeper",
    "description": "Play Minesweeper free online. Classic puzzle game - click cells, avoid mines, clear the board. Works in your browser.",
    "url": "https://knexio.xyz/games/minesweeper/",
    "publisher": { "@type": "Organization", "name": "Knexio" }
  }
  </script>
<style>
    :root {
      --bg-dark: #0b1220;
      --bg-dark-2: #070d1a;
      --panel: #111a2e;
      --border: rgba(255,255,255,0.08);
      --text-main: #ffffff;
      --text-sub: #aab3c5;
      --accent: #4f8cff;
      --cell-bg: #1a2335;
      --cell-hover: #233448;
      --cell-revealed: #0d1321;
      --cell-mine: #dc2626;

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-dark), var(--bg-dark-2));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .back { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; display: inline-block; }

    h1 { font-size: 32px; margin: 0 0 24px; text-align: center; }

    .intro {
      font-size: 16px; color: var(--text-sub); line-height: 1.7; margin-bottom: 32px;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79,140,255,0.3);
    }

    .info-bar {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-item span {
      color: var(--text-sub);
      font-size: 14px;
    }
    .info-value {
      color: var(--accent);
      font-weight: 600;
    }

    .game-board { margin: 0 auto;
      display: inline-grid;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 0 auto;
    }

    .cell {
      width: 32px;
      height: 32px;
      background: var(--cell-bg);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cell:hover { background: var(--cell-hover); }
    .cell.revealed { background: var(--cell-revealed); cursor: default; }
    .cell.flagged { color: #ef4444; }
    .cell.mine { background: var(--cell-mine); color: #fff; }
    .cell.safe-1 { color: #3b82f6; }
    .cell.safe-2 { color: #10b981; }
    .cell.safe-3 { color: #f59e0b; }
    .cell.safe-4 { color: #ef4444; }
    .cell.safe-5 { color: #8b5cf6; }
    .cell.safe-6 { color: #ec4899; }
    .cell.safe-7 { color: #6366f1; }
    .cell.safe-8 { color: #1f2937; }

    @media (max-width: 600px) {
      .cell { width: 28px; height: 28px; font-size: 16px; }
      .game-board { margin: 0 auto; padding: 12px; }
    }

    .ad-top { margin: 0 0 32px; text-align: center; min-height: 90px; }
    .ad-mid  { margin: 40px 0; text-align: center; min-height: 250px; }

    footer {
      font-size: 13px; text-align: center;
      color: var(--text-sub); border-top: 1px solid var(--border); padding-top: 30px;
    }
    footer a { color: var(--accent); }
  .ad-banner{margin:24px 0;text-align:center;min-height:90px}
  
    /* ==================== 移动端优化 ==================== */
    
    /* 平板和手机 (≤768px) */
    @media (max-width: 768px) {
      /* 容器布局优化 */
      .container, .wrap {
        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }
      
      /* 标题字体优化 */
      h1 {
        font-size: 28px !important;
        line-height: 1.3 !important;
      }
      
      h2 {
        font-size: 20px !important;
        margin-top: 36px !important;
        margin-bottom: 10px !important;
      }
      
      h3 {
        font-size: 17px !important;
      }
      
      /* 正文内容优化 */
      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      
      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }
      
      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }
      
      li {
        margin-bottom: 6px !important;
      }
      
      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }
      
      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }
      
      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }
      
      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      
      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }
      
      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }
      
      .grid { margin: 0 auto;
        gap: 8px !important;
      }
      
      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }
      
      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }
      
      .score-val {
        font-size: 18px !important;
      }
      
      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }
      
      .age-value {
        font-size: 24px !important;
      }
      
      .age-label {
        font-size: 11px !important;
      }
      
      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }
      
      .faq-item {
        margin-bottom: 20px !important;
      }
      
      .faq-item strong {
        font-size: 15px !important;
      }
    }
    
    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .container, .wrap {
        padding: 32px 12px 60px !important;
      }
      
      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }
      
      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }
      
      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    }
    </style>
</div>


<script src="/knexio-bundle.js"></script>

</body>
</html>
