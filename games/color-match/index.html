<style>

    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#4f8cff;--green:#34d399;--red:#f87171;--orange:#f97316;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
    .wrap{max-width:560px;margin:0 auto;padding:28px 16px 80px;text-align:center}
    .back{display:inline-block;margin-bottom:20px;color:var(--sub);font-size:14px;float:left}
    .clearfix::after{content:'';display:table;clear:both}
    h1{font-size:30px;margin-bottom:6px}
    .subtitle{color:var(--sub);font-size:14px;margin-bottom:20px}
    .ad-banner{margin:24px 0;text-align:center;min-height:90px}
    .hud{display:flex;justify-content:space-around;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:20px}
    .hud-item{text-align:center}
    .hud-val{font-size:22px;font-weight:700;color:var(--accent)}
    .hud-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.05em}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;margin-bottom:20px}
    .timer-bar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;margin-bottom:20px}

    .instruction{font-size:14px;color:var(--sub);margin-bottom:14px;line-height:1.5}
    .instruction b{color:var(--accent)}

    .color-btn{padding:16px;border-radius:12px;border:2px solid transparent;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.15s;color:#000}
    .color-btn:hover:not(:disabled){filter:brightness(1.15);transform:scale(1.03)}
    .color-btn.correct{border-color:#fff;animation:flash 0.2s}
    .color-btn.wrong{filter:grayscale(0.8);opacity:0.4}
    .feedback-text{font-size:17px;font-weight:600;min-height:24px;margin-top:10px}
    .feedback-text.ok{color:var(--green)}.feedback-text.no{color:var(--red)}

    .result-box h2{font-size:26px;margin-bottom:8px}
    .result-big{font-size:52px;font-weight:700;color:var(--accent);margin:8px 0}
    .btn{padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.15s}
