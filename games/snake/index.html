<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snake</title>
  <meta name="description" content="Play Snake free online. Eat food, grow longer, avoid walls and yourself. Classic arcade game in your browser.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://knexio.xyz/games/snake/" />
  <meta property="og:title" content="Snake" />
  <meta property="og:description" content="Eat the food, grow longer, avoid the walls and yourself" />
  <meta property="og:url" content="https://knexio.xyz/games/snake/" />
  <meta property="og:type" content="Game" />
  <meta property="og:site_name" content="Knexio" />
  <meta property="og:image" content="https://knexio.xyz/og-image.png" />
<style>
    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#4f8cff;--green:#34d399;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
    .wrap{max-width:860px;margin:0 auto;padding:28px 16px 80px;text-align:center}
    .back{display:inline-block;margin-bottom:20px;color:var(--sub);font-size:14px;float:left}
    .clearfix::after{content:'';display:table;clear:both}
    h1{font-size:30px;margin-bottom:6px}
    .subtitle{color:var(--sub);font-size:14px;margin-bottom:20px}
    .ad-slot{margin:16px 0}
    .score-bar{display:flex;justify-content:center;gap:40px;margin-bottom:16px}
    .score-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 24px}
    .score-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
    .score-val{font-size:28px;font-weight:800;color:var(--text)}
    .canvas-wrap{position:relative;display:inline-block}
    canvas{display:block;border-radius:16px;border:2px solid var(--border);background:#0d1829}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(7,13,26,.82);border-radius:16px;backdrop-filter:blur(4px)}
    .overlay h2{font-size:28px;margin-bottom:8px}
    .overlay p{color:var(--sub);font-size:14px;margin-bottom:24px}
    .overlay .final-score{font-size:48px;font-weight:900;color:var(--green);margin-bottom:8px}
    .btn{padding:12px 32px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--accent);color:#fff;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .controls-hint{margin-top:14px;color:var(--sub);font-size:13px}
    .difficulty{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
    .diff-btn{padding:7px 18px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:13px;font-weight:600}
    .diff-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .mobile-controls{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:16px}
    .dpad{width:56px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;user-select:none}
    .dpad:active{background:rgba(79,140,255,.2)}
    footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:60px;font-size:13px;color:var(--sub);text-align:center;border-top:1px solid var(--border);}
  .ad-banner{margin:24px 0;text-align:center;min-height:90px}
  
    /* ==================== 移动端优化 ==================== */
    
    /* 平板和手机 (≤768px) */
    @media (max-width: 768px) {
      /* 容器布局优化 */
      .container, .wrap {
        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }
      
      /* 标题字体优化 */
      h1 {
        font-size: 28px !important;
        line-height: 1.3 !important;
      }
      
      h2 {
        font-size: 20px !important;
        margin-top: 36px !important;
        margin-bottom: 10px !important;
      }
      
      h3 {
        font-size: 17px !important;
      }
      
      /* 正文内容优化 */
      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      
      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }
      
      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }
      
      li {
        margin-bottom: 6px !important;
      }
      
      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }
      
      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }
      
      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }
      
      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      
      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }
      
      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }
      
      .grid {
        gap: 8px !important;
      }
      
      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }
      
      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }
      
      .score-val {
        font-size: 18px !important;
      }
      
      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }
      
      .age-value {
        font-size: 24px !important;
      }
      
      .age-label {
        font-size: 11px !important;
      }
      
      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }
      
      .faq-item {
        margin-bottom: 20px !important;
      }
      
      .faq-item strong {
        font-size: 15px !important;
      }
    }
    
    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .container, .wrap {
        padding: 32px 12px 60px !important;
      }
      
      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }
      
      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }
      
      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    </style>



<script src="/knexio-bundle.js"></script>
  
    
</div>

      <p>Free online games to play anytime. Enjoy classic games, puzzles, and entertainment.</p>

        <a href="/contact/" style="color: var(--accent); text-decoration: none; margin: 0 8px;">Contact</a>
      </p>
      <p>© 2026 Knexio. All rights reserved.</p>
    </footer>
</body>
