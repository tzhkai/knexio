<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>✏️ Mini Crossword</title>
  <meta name="description" content="Play Mini Crossword free online. Fill the 5×5 grid using Across and Down clues. Quick daily puzzle. Works in your browser.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://knexio.xyz/games/mini-crossword/" />
  <meta property="og:title" content="✏️ Mini Crossword" />
  <meta property="og:description" content="Fill the 5×5 grid using Across and Down clues. Click a cell and type." />
  <meta property="og:url" content="https://knexio.xyz/games/mini-crossword/" />
  <meta property="og:type" content="Game" />
  <meta property="og:site_name" content="Knexio" />
  <meta property="og:image" content="https://knexio.xyz/og-image.png" />
<style>
    :root{--bg:#0b1220;--bg2:#070d1a;--panel:#111a2e;--border:rgba(255,255,255,0.08);--text:#fff;--sub:#aab3c5;--accent:#4f8cff;--green:#22c55e;--yellow:#fbbf24;;--text-main:#fff;--text-sub:#aab3c5}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    .wrap{max-width:720px;margin:0 auto;padding:40px 16px 80px;}
    .back{display:inline-block;margin-bottom:20px;font-size:14px;color:var(--sub);}
    .back:hover{color:var(--accent);}
    h1{font-size:30px;margin-bottom:6px;}
    .subtitle{font-size:15px;color:var(--sub);margin-bottom:18px;}
    .ad-slot{margin:18px 0;text-align:center;min-height:90px;background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.08);border-radius:8px;display:flex;align-items:center;justify-content:center;}
    .game-layout{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;}
    .grid-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:12px;}
    .crossword-grid{display:grid;gap:3px;background:#0a1020;border:3px solid #1a2540;border-radius:10px;padding:6px;}
    .cell{width:52px;height:52px;background:#1e2d4a;border:1px solid rgba(255,255,255,0.1);position:relative;cursor:pointer;transition:background 0.1s;}
    .cell.black{background:#000;cursor:default;border-color:#000;}
    .cell.active{background:rgba(79,140,255,0.3);border-color:var(--accent);}
    .cell.highlighted{background:rgba(79,140,255,0.12);}
    .cell.correct{background:rgba(34,197,94,0.2);}
    .cell.wrong{background:rgba(248,113,113,0.15);}
    .cell input{position:absolute;inset:0;width:100%;height:100%;background:none;border:none;color:#fff;font-size:22px;font-weight:700;text-align:center;text-transform:uppercase;outline:none;cursor:pointer;caret-color:transparent;}
    .cell-num{position:absolute;top:2px;left:3px;font-size:10px;color:var(--sub);font-weight:600;line-height:1;}
    .clues-panel{min-width:0;}
    .clue-section{margin-bottom:20px;}
    .clue-section h3{font-size:14px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
    .clue{padding:8px 12px;border-radius:8px;font-size:14px;color:var(--sub);cursor:pointer;transition:background 0.15s;display:flex;gap:8px;align-items:baseline;}
    .clue:hover{background:rgba(255,255,255,0.05);}
    .clue.active{background:rgba(79,140,255,0.12);color:var(--text);}
    .clue.solved{color:var(--green);}
    .clue .cn{min-width:20px;font-weight:700;color:var(--accent);font-size:13px;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .btn{padding:9px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;transition:opacity 0.18s;}
    .btn:hover{opacity:0.85;}
    .btn.secondary{background:var(--panel);border:1px solid var(--border);color:var(--sub);}
    .timer-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
    .timer{font-size:18px;font-family:monospace;color:var(--accent);font-weight:700;}
    .mode-seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
    .mode-seg button{padding:7px 14px;background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;}
    .mode-seg button.active{background:var(--accent);color:#fff;}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:center;justify-content:center;}
    .modal-overlay.show{display:flex;}
    .modal{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 28px;text-align:center;max-width:320px;width:100%;}
    .modal h2{font-size:26px;margin-bottom:8px;}
    .modal p{color:var(--sub);margin-bottom:18px;font-size:15px;}
    .modal .ad-slot{margin:0 0 18px;min-height:70px;}
    .modal .btn{width:100%;}
    footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:40px;text-align:center;font-size:13px;color:var(--sub);border-top:1px solid var(--border);}
    footer a{color:var(--sub);margin:0 10px;}
    footer a:hover{color:var(--accent);}
  .ad-banner{margin:24px 0;text-align:center;min-height:90px}
  
    /* ==================== 移动端优化 ==================== */
    
    /* 平板和手机 (≤768px) */
    @media (max-width: 768px) {
      /* 容器布局优化 */
      .container, .wrap {
        padding: 40px 15px 80px !important;
        max-width: 100% !important;
      }
      
      /* 标题字体优化 */
      h1 {
        font-size: 28px !important;
        line-height: 1.3 !important;
      }
      
      h2 {
        font-size: 20px !important;
        margin-top: 36px !important;
        margin-bottom: 10px !important;
      }
      
      h3 {
        font-size: 17px !important;
      }
      
      /* 正文内容优化 */
      p, li, .intro, .subtitle {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      
      /* 段落间距优化 */
      p, ul, ol {
        margin-bottom: 16px !important;
      }
      
      /* 列表优化 */
      ul, ol {
        padding-left: 18px !important;
      }
      
      li {
        margin-bottom: 6px !important;
      }
      
      /* 内容块优化 */
      .main-panel, .step-block, .notice, .extra-info {
        padding: 16px !important;
        border-radius: 12px !important;
        margin: 16px 0 !important;
      }
      
      /* 按钮和输入框优化 */
      .btn {
        padding: 14px !important;
        font-size: 15px !important;
        min-height: 48px !important;
      }
      
      .input-group input {
        padding: 12px !important;
        font-size: 15px !important;
      }
      
      /* 网格系统优化 */
      .age-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      
      /* 广告位优化 */
      .ad-banner {
        margin: 16px 0 !important;
        min-height: 50px !important;
      }
      
      /* 游戏页面优化 */
      .grid-container {
        padding: 8px !important;
      }
      
      .grid {
        gap: 8px !important;
      }
      
      .cell {
        font-size: 20px !important;
        border-radius: 6px !important;
      }
      
      .score-box {
        min-width: 70px !important;
        padding: 6px 12px !important;
      }
      
      .score-val {
        font-size: 18px !important;
      }
      
      /* 工具页面优化 */
      .age-main {
        font-size: 36px !important;
      }
      
      .age-value {
        font-size: 24px !important;
      }
      
      .age-label {
        font-size: 11px !important;
      }
      
      /* 引导页面优化 */
      .intro {
        border-left-width: 2px !important;
        padding-left: 12px !important;
        margin-bottom: 32px !important;
      }
      
      .faq-item {
        margin-bottom: 20px !important;
      }
      
      .faq-item strong {
        font-size: 15px !important;
      }
    }
    
    /* 小手机优化 (≤480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px !important;
      }
      
      h2 {
        font-size: 18px !important;
      }
      
      .container, .wrap {
        padding: 32px 12px 60px !important;
      }
      
      .main-panel, .step-block, .notice {
        padding: 14px !important;
      }
      
      .btn {
        padding: 12px !important;
        font-size: 14px !important;
      }
      
      .age-grid {
        grid-template-columns: 1fr !important;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      button, .btn, a[onclick], .cell {
        min-height: 44px !important;
        min-width: 44px !important;
      }
      
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    }
    </style>
</div>
