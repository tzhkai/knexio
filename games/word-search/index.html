    :root { --bg: #0b1220; --panel: #111a2e; --accent: #4f8cff; --text: #fff; --sub: #aab3c5; --success: #4ecb71;; --text-main: #fff; --text-sub: #aab3c5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px; text-align: center; }
    .back { display: block; text-align: left; color: var(--sub); margin-bottom: 16px; text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--accent); }
    h1 { font-size: 30px; font-weight: 800; margin-bottom: 6px; letter-spacing: 1px; }
    .tagline { color: var(--sub); font-size: 14px; margin-bottom: 16px; }
    .game-wrap { background: var(--panel); border-radius: 16px; padding: 20px; margin: 0 0 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 15px; font-weight: 600; flex-wrap: wrap; gap: 10px; }
    .hud-found { color: var(--success); }
    .hud-timer { color: var(--accent); }
    .category-select { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; flex-wrap: wrap; }
    .cat-btn { padding: 8px 16px; background: #1e2d4a; border: 1px solid var(--accent); border-radius: 20px; color: var(--sub); font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .cat-btn:hover, .cat-btn.active { background: var(--accent); color: #fff; }
    .grid-container { display: inline-block; background: #1a1a2e; padding: 12px; border-radius: 12px; margin-bottom: 16px; }
    .grid { margin: 0 auto; display: grid; gap: 2px; user-select: none; }
    .cell { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #0b1220; border-radius: 6px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .cell:hover { background: #1e2d4a; }
    .cell.selected { background: var(--accent); color: #fff; }
    .cell.found { background: var(--success); color: #fff; }
    .cell.highlight { background: #ffa53d; color: #fff; }
    .word-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    .word-item { padding: 6px 14px; background: #1a1a2e; border-radius: 16px; font-size: 14px; color: var(--sub); }
    .word-item.found { background: var(--success); color: #fff; text-decoration: line-through; opacity: 0.7; }
    .btn { padding: 12px 30px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .btn:hover { opacity: 0.9; }
    .win-message { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); z-index: 100; }
    .win-message.show { display: block; }
    .win-message h2 { font-size: 32px; margin-bottom: 16px; color: var(--success); }
    .info-section { background: var(--panel); border-radius: 12px; padding: 20px 24px; text-align: left; margin-bottom: 20px; }
    .info-section h2 { font-size: 18px; margin-bottom: 10px; color: var(--accent); }
    .info-section p, .info-section li { color: var(--sub); font-size: 14px; line-height: 1.7; }
    .info-section ul { margin-left: 18px; }
