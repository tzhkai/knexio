<script>
const COLS = 10, ROWS = 20, BLOCK = 24;
const COLORS = ['','#4f8cff','#f87171','#34d399','#fbbf24','#a78bfa','#f97316','#7dd3fc'];
const SHAPES = [
  [],
  [[1,1,1,1]],                       // I
  [[2,0],[2,0],[2,2]],                // J
  [[0,3],[0,3],[3,3]],                // L
  [[4,4],[4,4]],                      // O
  [[0,5,5],[5,5,0]],                  // S
  [[6,6,6],[0,6,0]],                  // T
  [[7,7,0],[0,7,7]]                   // Z
];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nCtx = nextCanvas.getContext('2d');

let board, cur, curX, curY, nextPiece, score, level, lines, running, paused, dropTimer, best;

function newBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill(0)) }

function newPiece(){
  const id = Math.ceil(Math.random()*7);
  return SHAPES[id].map(r=>[...r])
}

function startGame(){
  board = newBoard();
  score = 0; level = 1; lines = 0;
  best = parseInt(localStorage.getItem('tetris_best')||'0');
  document.getElementById('best').textContent = best;
  nextPiece = newPiece();
  spawn();
  running = true; paused = false;
  document.getElementById('overlay').style.display='none';
  document.getElementById('pauseBtn').textContent='Pause';
  clearInterval(dropTimer);
  dropTimer = setInterval(tick, dropInterval());
  update()
}

function dropInterval(){ return Math.max(100, 800 - (level-1)*70) }

function spawn(){
  cur = nextPiece;
  nextPiece = newPiece();
  curX = Math.floor((COLS - cur[0].length)/2);
  curY = 0;
  if(collide(cur,curX,curY)){ gameOver() }
  drawNext()
}

function collide(piece, px, py){
  for(let r=0;r<piece.length;r++)
    for(let c=0;c<piece[r].length;c++)
      if(piece[r][c] && (py+r>=ROWS || px+c<0 || px+c>=COLS || board[py+r][px+c]))
        return true;
  return false
}

function place(){
  for(let r=0;r<cur.length;r++)
    for(let c=0;c<cur[r].length;c++)
      if(cur[r][c]) board[curY+r][curX+c]=cur[r][c];
  clearLines();
  spawn()
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;){
    if(board[r].every(v=>v)){
      board.splice(r,1); board.unshift(Array(COLS).fill(0)); cleared++
    } else r--
  }
  if(cleared){
    const pts=[0,100,300,500,800];
    score+=pts[cleared]*level;
    lines+=cleared;
    level=Math.floor(lines/10)+1;
    if(score>best){ best=score; localStorage.setItem('tetris_best',best); document.getElementById('best').textContent=best }
    clearInterval(dropTimer); dropTimer=setInterval(tick, dropInterval());
    updateStats()
  }
}

function rotate(piece){
  const rows=piece.length, cols=piece[0].length;
  const rotated=Array.from({length:cols},(_,c)=>Array.from({length:rows},(_,r)=>piece[rows-1-r][c]));
  return rotated
}

function tick(){
  if(!running||paused)return;
  if(!collide(cur,curX,curY+1)) curY++;
  else place();
  update()
}

function hardDrop(){
  while(!collide(cur,curX,curY+1)) curY++;
  place(); update()
}

function togglePause(){
  if(!running)return;
  paused=!paused;
  document.getElementById('pauseBtn').textContent=paused?'Resume':'Pause';
  if(paused){
    const ov=document.getElementById('overlay');
    document.getElementById('overlayTitle').textContent='Paused';
    document.getElementById('overlayMsg').textContent='';
    document.getElementById('startBtn').textContent='Resume';
    document.getElementById('startBtn').onclick=togglePause;
    ov.style.display='flex'
  } else {
    document.getElementById('overlay').style.display='none';
    document.getElementById('startBtn').textContent='Restart';
    document.getElementById('startBtn').onclick=startGame
  }
}

function gameOver(){
  running=false;
  clearInterval(dropTimer);
  const ov=document.getElementById('overlay');
  document.getElementById('overlayTitle').textContent='Game Over';
  document.getElementById('overlayMsg').textContent='Score: '+score;
  document.getElementById('startBtn').textContent='Play Again';
  document.getElementById('startBtn').onclick=startGame;
  ov.style.display='flex'
}

function updateStats(){
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('lines').textContent=lines
}

function update(){
  updateStats();
  draw()
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Board
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(board[r][c]){ drawBlock(ctx,c,r,COLORS[board[r][c]]) }
    else { ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.strokeRect(c*BLOCK,r*BLOCK,BLOCK,BLOCK) }
  }
  // Ghost piece
  let ghostY=curY;
  while(!collide(cur,curX,ghostY+1)) ghostY++;
  if(ghostY>curY) for(let r=0;r<cur.length;r++) for(let c=0;c<cur[r].length;c++)
    if(cur[r][c]){ const color=COLORS[cur[r][c]]; ctx.globalAlpha=.25; drawBlock(ctx,curX+c,ghostY+r,color); ctx.globalAlpha=1 }
  // Current piece
  for(let r=0;r<cur.length;r++) for(let c=0;c<cur[r].length;c++)
    if(cur[r][c]) drawBlock(ctx,curX+c,curY+r,COLORS[cur[r][c]])
}

function drawBlock(c,x,y,color){
  c.fillStyle=color;
  c.fillRect(x*BLOCK+1,y*BLOCK+1,BLOCK-2,BLOCK-2);
  c.fillStyle='rgba(255,255,255,.15)';
  c.fillRect(x*BLOCK+1,y*BLOCK+1,BLOCK-2,4)
}

function drawNext(){
  nCtx.clearRect(0,0,80,80);
  const p=nextPiece;
  const off=Math.floor((4-p[0].length)/2);
  const ov=Math.floor((4-p.length)/2);
  const bs=18;
  for(let r=0;r<p.length;r++) for(let c=0;c<p[r].length;c++)
    if(p[r][c]){ nCtx.fillStyle=COLORS[p[r][c]]; nCtx.fillRect((off+c)*bs+2,(ov+r)*bs+2,bs-2,bs-2) }
}

document.addEventListener('keydown',e=>{
  if(!running||paused){
    if(e.key==='p'||e.key==='P') togglePause();
    return
  }
  switch(e.key){
    case 'ArrowLeft': if(!collide(cur,curX-1,curY)) curX--; break;
    case 'ArrowRight': if(!collide(cur,curX+1,curY)) curX++; break;
    case 'ArrowDown': if(!collide(cur,curX,curY+1)) curY++; break;
    case 'ArrowUp': case 'z': case 'Z': { const r=rotate(cur); if(!collide(r,curX,curY)) cur=r; break }
    case ' ': hardDrop(); return;
    case 'p': case 'P': togglePause(); return
  }
  update();
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault()
});

// Touch controls for mobile
let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;e.preventDefault()},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(!running||paused)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx<-20&&!collide(cur,curX-1,curY)) curX--;
    else if(dx>20&&!collide(cur,curX+1,curY)) curX++
  } else {
    if(dy>20&&!collide(cur,curX,curY+1)) curY++;
    else if(dy<-20){ const r=rotate(cur); if(!collide(r,curX,curY)) cur=r }
  }
  if(Math.abs(dx)<10&&Math.abs(dy)<10){ const r=rotate(cur); if(!collide(r,curX,curY)) cur=r }
  update();
  e.preventDefault()
},{passive:false});
</script></div>
