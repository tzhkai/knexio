footer{max-width:900px;margin-left:auto;margin-right:auto;display:block;margin-top:60px;text-align:center;color:var(--sub);font-size:13px;

    function renderPrompts(filter = 'all') {
      const grid = document.getElementById('promptGrid');
      grid.innerHTML = '';

      const filtered = filter === 'all' 
        ? prompts 
        : prompts.filter(p => p.category === filter);

      filtered.forEach(prompt => {
        const card = document.createElement('div');
        card.className = 'prompt-card';
        card.onclick = () => openModal(prompt);
        card.innerHTML = `
          <div class="prompt-category">${prompt.category}</div>
          <div class="prompt-title">${prompt.title}</div>
          <div class="prompt-preview">${prompt.preview}</div>
        `;
        grid.appendChild(card)
      })
    }

    function filterPrompts() {
      const filter = document.getElementById('categoryFilter').value;
      renderPrompts(filter)
    }

    function openModal(prompt) {
      document.getElementById('modalTitle').textContent = prompt.title;
      document.getElementById('modalPrompt').textContent = prompt.full;
      document.getElementById('promptModal').classList.add('active')
    }

    function closeModal() {
      document.getElementById('promptModal').classList.remove('active')
    }

    function copyModalPrompt() {
      const prompt = document.getElementById('modalPrompt').textContent;
      navigator.clipboard.writeText(prompt).then(() => {
        alert('Prompt copied to clipboard!')
      })
    }

    // Close modal on outside click
    document.getElementById('promptModal').onclick = function(e) {
      if (e.target === this) closeModal()
    };

    // Initial render
    renderPrompts();
  </script>
