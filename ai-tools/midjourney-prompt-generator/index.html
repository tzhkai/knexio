  <script>
    function generate() {
      const subject = document.getElementById('subject').value || 'beautiful landscape';
      const style = document.getElementById('style').value;
      const lighting = document.getElementById('lighting').value;
      const composition = document.getElementById('composition').value;
      const details = document.getElementById('details').value;

      let prompt = `/imagine prompt: ${subject}, ${style}, ${lighting}, ${composition}`;

      if (details.trim()) {
        prompt += `, ${details}`
      }

      prompt += ` --ar 16:9 --v 6`;

      document.getElementById('result').textContent = prompt
    }

    function copyPrompt() {
      const prompt = document.getElementById('result').textContent;
      if (prompt === 'Your prompt will appear here...') {
        return
      }
      navigator.clipboard.writeText(prompt).then(() => {
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = '✓ Copied!';
        setTimeout(() => {
          btn.textContent = originalText
        }, 2000)
      })
    }
  </script>
