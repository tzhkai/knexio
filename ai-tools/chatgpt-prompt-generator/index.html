      let prompt = `Please ${task} in a ${tone} tone. Format the response as ${format}. Be thorough and provide actionable insights.`;

      }

    }

    function copyPrompt() {
      const prompt = document.getElementById('result').textContent;
      if (prompt === 'Your prompt will appear here...') {
        return
      }
      navigator.clipboard.writeText(prompt).then(() => {
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = '✓ Copied!';
        setTimeout(() => {
          btn.textContent = originalText
        }, 2000)
      })
    }
