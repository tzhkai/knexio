<script>
function generatePosts() {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) {
    alert('Please enter a post topic');
    return
  }
  const platform = document.getElementById('platform').value;
  const style = document.getElementById('style').value;
  
  const titleCase = s => s ? s[0].toUpperCase() + s.slice(1) : '';
  const topicLC = topic.toLowerCase();
  const topicTC = titleCase(topicLC);
  
  const posts = [];
  
  if (platform === 'all' || platform === 'twitter') {
    let tweet = style === 'informative'
      ? '🧵 Everything you need to know about ' + topicLC + ':

• ' + topicTC + ' matters more than most realize
• The key is consistency, not perfection
• Small steps compound fast

Save this for later 👇'
      : style === 'humorous'
      ? topicLC + ' be like:

"Yeah I should do that"
"Nah let me scroll first"

— 3 hours later —

"Okay NOW I'll handle it" 😮‍💨

Relatable? Drop a 👋'
      : style === 'inspirational'
      ? 'Every expert started somewhere.

Including you. Including ' + topicLC + '.

The journey of 1000 miles begins with a single step.

What\'s your next step? 🚀'
      : 'Quick question:

What\'s your biggest challenge with ' + topicLC + '?

Drop it in the replies 👇 I\'m reading every one.';
    posts.push({platform: 'Twitter/X', text: tweet})
  }
  
  if (platform === 'all' || platform === 'linkedin') {
    let lp = style === 'informative'
      ? 'I\'ve spent years studying what separates high performers from the rest when it comes to ' + topicLC + '.

The results:

1. Intentionality beats intensity
2. Small daily wins compound
3. Remove what\'s broken before adding more

What would you add? 👇'
      : style === 'humorous'
      ? 'POV: Trying to explain why ' + topicLC + ' matters to someone who\'s never tried it.

*internally* just trust me 😭

Your go-to analogy? 👇'
      : style === 'inspirational'
      ? 'The best time to start ' + topicLC + ' was 6 months ago.

The second best time is right now.

Don\'t wait for the "perfect moment."

Take one action today.'
      : 'What\'s the #1 thing holding you back with ' + topicLC + '?

I\'ve seen hundreds face the same challenge. Let\'s talk 💬';
    posts.push({platform: 'LinkedIn', text: lp})
  }
  
  if (platform === 'all' || platform === 'instagram') {
    let ig = style === 'inspirational'
      ? 'You don\'t have to be perfect at ' + topicLC + '.

You just have to start.

One step. One decision.

Save this. Share it. Take action today. ✨'
      : 'Your ' + topicLC + ' reminder:

✅ Small steps add up
✅ Consistency beats intensity
✅ You\'re closer than you think

Follow for daily tips ✨';
    posts.push({platform: 'Instagram', text: ig})
  }
  
  const container = document.getElementById('posts');
  container.innerHTML = posts.map(function(p) {
    return '<div class="post-card"><div class="platform">' + p.platform + '</div><p style="white-space:pre-wrap">' + p.text + '</p></div>'
  }).join('')
}</script>
