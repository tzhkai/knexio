        const styleKeywords = ['photorealistic', 'highly detailed', 'vibrant colors', 'dramatic lighting', 'masterpiece', '8K', 'cinematic'];
        const lightingKeywords = ['golden hour', 'soft natural light', 'dramatic lighting', 'neon lights', 'moonlight'];

        const randomStyle = styleKeywords[Math.floor(Math.random() * styleKeywords.length)];
        const randomLighting = lightingKeywords[Math.floor(Math.random() * lightingKeywords.length)];
        const randomComposition = compositionKeywords[Math.floor(Math.random() * compositionKeywords.length)];

        const prompt = `${input}, ${randomStyle}, ${randomLighting}, ${randomComposition} --ar 16:9 --v 6 --style raw`;
        result.textContent = prompt
      }, 500)

    function copyText() {

      if (result && result.textContent !== 'Your generated Midjourney prompt will appear here...' && result.textContent !== 'Generating prompt...') {
