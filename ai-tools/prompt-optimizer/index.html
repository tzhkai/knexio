      const optimization = document.getElementById('optimization').value;
      const result = document.getElementById('result');

      if (!promptInput.value.trim()) {
        result.textContent = 'Please enter a prompt to optimize.';
        return
      }

      let optimizedPrompt = promptInput.value.trim();

      // Apply optimization based on selected mode
      switch(optimization) {
        case 'clarity':
          optimizedPrompt = optimizeForClarity(optimizedPrompt);
          break;
        case 'specificity':
          optimizedPrompt = optimizeForSpecificity(optimizedPrompt);
          break;
        case 'structure':
          optimizedPrompt = optimizeForStructure(optimizedPrompt);
          break;
        case 'effectiveness':
          optimizedPrompt = optimizeForEffectiveness(optimizedPrompt);
          break
      }

      result.textContent = optimizedPrompt
    }

    function optimizeForClarity(prompt) {
      // Remove ambiguity and improve readability
      let optimized = prompt;
      
      // Remove redundant words
      optimized = optimized.replace(/\b(really|very|quite|rather|somewhat)\b/gi, '');
      optimized = optimized.replace(/\b  +/g, ' ').trim();
      
      // Add clear structure if missing
      if (!optimized.includes('Please') && !optimized.includes('I need') && !optimized.includes('Help me')) {
        optimized = 'Please ' + optimized.charAt(0).toLowerCase() + optimized.slice(1)
      }
      
      // Ensure complete sentences
      if (!optimized.endsWith('.')) {
        optimized += '.'
      }
      
      return optimized
    }

    function optimizeForSpecificity(prompt) {
      // Add detail and context
      let optimized = prompt;
      
      // Add context prefixes if missing
      const contextKeywords = ['explain', 'describe', 'analyze', 'compare', 'evaluate', 'discuss'];
      const hasContext = contextKeywords.some(keyword => optimized.toLowerCase().includes(keyword));
      
      if (!hasContext) {
        optimized = 'Please provide a detailed explanation of: ' + optimized
      }
      
      // Add specificity enhancements
      if (!optimized.includes('with examples')) {
        optimized += ' Include relevant examples to support your answer.'
      }
      
      if (!optimized.includes('step by step')) {
        optimized += ' Present your response in a clear, step-by-step manner.'
      }
      
      return optimized
    }

    function optimizeForStructure(prompt) {
      // Organize prompt logically
      let optimized = prompt;
      
      // Add clear structure indicators
      if (!optimized.includes('First') && !optimized.includes('1.') && !optimized.includes('-')) {
        optimized = 'Structure your response as follows:\n\n' + optimized + '\n\nEnsure each point is clearly separated and well-organized.'
      }
      
      // Add section markers if missing
      if (optimized.includes('Introduction') && !optimized.includes('##')) {
        optimized = optimized.replace(/(Introduction|Overview|Background)/g, '## $1');
        optimized = optimized.replace(/(Conclusion|Summary)/g, '## $1')
      }
      
      return optimized
    }

    function optimizeForEffectiveness(prompt) {
      // Combine all optimizations for maximum impact
      let optimized = prompt;
      
      // Apply clarity
      optimized = optimized.replace(/\b(really|very|quite|rather|somewhat)\b/gi, '');
      optimized = optimized.replace(/\b  +/g, ' ').trim();
      
      // Apply specificity
      if (!optimized.includes('with examples')) {
        optimized += ' Include relevant examples.'
      }
      
      // Apply structure
      if (!optimized.includes('step by step')) {
        optimized += ' Present in a clear, step-by-step manner.'
      }
      
      // Add effectiveness markers
      if (!optimized.includes('Be thorough')) {
        optimized = 'Be thorough and comprehensive in your response. ' + optimized
      }
      
      return optimized
    }
