  <script>
  function switchTab(t) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (t==='timer'&&i===0)||(t==='stopwatch'&&i===1)));
    document.getElementById('tab-timer').classList.toggle('active', t==='timer');
    document.getElementById('tab-stopwatch').classList.toggle('active', t==='stopwatch')
  }

  let timerInterval = null;
  let timerRemaining = 0;
  let timerRunning = false;

  function setPreset(h,m,s) {
    document.getElementById('t-h').value = h;
    document.getElementById('t-m').value = m;
    document.getElementById('t-s').value = s;
    timerReset()
  }

  function getTimerInput() {
    const h = parseInt(document.getElementById('t-h').value)||0;
    const m = parseInt(document.getElementById('t-m').value)||0;
    const s = parseInt(document.getElementById('t-s').value)||0;
    return h*3600 + m*60 + s
  }

  function formatTime(secs) {
    const h = Math.floor(secs/3600).toString().padStart(2,'0');
    const m = Math.floor((secs%3600)/60).toString().padStart(2,'0');
    const s = (secs%60).toString().padStart(2,'0');
    return `${h}:${m}:${s}`
  }

  function timerToggle() {
    if (!timerRunning) {
      if (timerRemaining === 0) timerRemaining = getTimerInput();
      if (timerRemaining <= 0) return;
      timerRunning = true;
      document.getElementById('timer-btn').textContent = 'Pause';
      document.getElementById('timer-btn').className = 'btn-pause';
      document.getElementById('timer-display').classList.add('running');
      timerInterval = setInterval(() => {
        timerRemaining--;
        document.getElementById('timer-display').textContent = formatTime(timerRemaining);
        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          timerRunning = false;
          document.getElementById('timer-btn').textContent = 'Start';
          document.getElementById('timer-btn').className = 'btn-start';
          document.getElementById('timer-display').classList.remove('running');
          document.getElementById('timer-display').classList.add('done');
          beep()
        }
      }, 1000)
    } else {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timer-btn').textContent = 'Resume';
      document.getElementById('timer-btn').className = 'btn-start';
      document.getElementById('timer-display').classList.remove('running')
    }
  }

  function timerReset() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerRemaining = 0;
    document.getElementById('timer-display').textContent = '00:00:00';
    document.getElementById('timer-display').className = 'time-display';
    document.getElementById('timer-btn').textContent = 'Start';
    document.getElementById('timer-btn').className = 'btn-start'
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.3, 0.6].forEach(t => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.5, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
        o.start(ctx.currentTime + t);
        o.stop(ctx.currentTime + t + 0.25)
      })
    } catch(e) {}
  }

  let swInterval = null;
  let swRunning = false;
  let swStart = 0;
  let swElapsed = 0;
  let lapCount = 0;

  function formatSW(ms) {
    const m = Math.floor(ms/60000).toString().padStart(2,'0');
    const s = Math.floor((ms%60000)/1000).toString().padStart(2,'0');
    const mss = (ms%1000).toString().padStart(3,'0');
    return `${m}:${s}.${mss}`
  }

  function swToggle() {
    if (!swRunning) {
      swStart = Date.now() - swElapsed;
      swRunning = true;
      document.getElementById('sw-btn').textContent = 'Stop';
      document.getElementById('sw-btn').className = 'btn-pause';
      document.getElementById('lap-btn').disabled = false;
      swInterval = setInterval(() => {
        swElapsed = Date.now() - swStart;
        document.getElementById('sw-display').textContent = formatSW(swElapsed)
      }, 31)
    } else {
      clearInterval(swInterval);
      swRunning = false;
      document.getElementById('sw-btn').textContent = 'Resume';
      document.getElementById('sw-btn').className = 'btn-start'
    }
  }

  function swLap() {
    if (!swRunning) return;
    lapCount++;
    const item = document.createElement('div');
    item.className = 'lap-item';
    item.innerHTML = `<span>Lap ${lapCount}</span><span>${formatSW(swElapsed)}</span>`;
    document.getElementById('lap-list').prepend(item)
  }

  function swReset() {
    clearInterval(swInterval);
    swRunning = false;
    swElapsed = 0;
    lapCount = 0;
    document.getElementById('sw-display').textContent = '00:00.000';
    document.getElementById('sw-btn').textContent = 'Start';
    document.getElementById('sw-btn').className = 'btn-start';
    document.getElementById('lap-btn').disabled = true;
    document.getElementById('lap-list').innerHTML = ''
  }
  </script>
