  <script>
    let originalFile = null;
    let compressedBlob = null;
    
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValue = document.getElementById('qualityValue');
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover')
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover')
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFile(file)
      }
    });
    
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file)
    });
    
    qualitySlider.addEventListener('input', (e) => {
      qualityValue.textContent = e.target.value + '%';
      if (originalFile) compressImage()
    });
    
    function handleFile(file) {
      if (file.size > 10 * 1024 * 1024) {
        alert('File too large. Max size is 10MB.');
        return
      }
      originalFile = file;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('originalImg').src = e.target.result;
        document.getElementById('originalInfo').textContent = 
          `${file.name} • ${(file.size / 1024).toFixed(1)} KB`;
        document.getElementById('controls').style.display = 'block';
        compressImage()
      };
      reader.readAsDataURL(file)
    }
    
    function compressImage() {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        
        const quality = qualitySlider.value / 100;
        const mimeType = originalFile.type === 'image/png' ? 'image/jpeg' : originalFile.type;
        
        canvas.toBlob((blob) => {
          compressedBlob = blob;
          const url = URL.createObjectURL(blob);
          document.getElementById('compressedImg').src = url;
          
          const savings = ((originalFile.size - blob.size) / originalFile.size * 100).toFixed(1);
          document.getElementById('compressedInfo').innerHTML = 
            `${(blob.size / 1024).toFixed(1)} KB • <span class="savings">-${savings}%</span>`;
          
          document.getElementById('downloadBtn').disabled = false
        }, mimeType, quality)
      };
      img.src = document.getElementById('originalImg').src
    }
    
    function downloadCompressed() {
      if (!compressedBlob) return;
      const url = URL.createObjectURL(compressedBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'compressed_' + originalFile.name;
      a.click();
      URL.revokeObjectURL(url)
    }
  </script>
