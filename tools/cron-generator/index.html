<script>
const descs = {
  '* * * * *': 'Runs every minute',
  '0 * * * *': 'Runs at the start of every hour',
  '0 0 * * *': 'Runs at midnight every day',
  '0 9 * * *': 'Runs at 9 AM every day',
  '0 12 * * *': 'Runs at noon every day',
  '0 18 * * *': 'Runs at 6 PM every day',
  '0 0 1 * *': 'Runs at midnight on the 1st of every month',
  '0 0 15 * *': 'Runs at midnight on the 15th of every month',
  '* * 1 * *': 'Runs every minute on the 1st',
  '* * * 1 *': 'Runs every minute in January',
  '* * * 6 *': 'Runs every minute in June',
  '0 9 * 1-5 *': 'Runs at 9 AM on weekdays',
  '0 0 * * 0,6': 'Runs at midnight on weekends',
};

function updateCron() {
  const min = document.getElementById('minute').value;
  const hr = document.getElementById('hour').value;
  const dom = document.getElementById('dom').value;
  const mon = document.getElementById('month').value;
  const dow = document.getElementById('dow').value;
  
  const cron = `${min} ${hr} ${dom} ${mon} ${dow}`;
  document.getElementById('cron').textContent = cron;
  
  document.getElementById('desc').textContent = descs[cron] || 'Custom schedule'
}

function copyCron() {
  const cron = document.getElementById('cron').textContent;
  navigator.clipboard.writeText(cron);
  alert('Copied: ' + cron)
}
