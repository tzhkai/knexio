<script>
function calculate() {
  const goal = parseFloat(document.getElementById('goal').value);
  const current = parseFloat(document.getElementById('current').value) || 0;
  const monthly = parseFloat(document.getElementById('monthly').value);
  const annualRate = parseFloat(document.getElementById('rate').value) || 0;
  
  if (!goal || !monthly) { alert('Please enter goal and monthly contribution'); return }
  
  const monthlyRate = annualRate / 100 / 12;
  let balance = current;
  let months = 0;
  let totalContributed = current;
  
  while (balance < goal && months < 1200) {
    balance = balance * (1 + monthlyRate) + monthly;
    totalContributed += monthly;
    months++
  }
  
  const interestEarned = balance - totalContributed;
  const years = Math.floor(months / 12);
  const remainMonths = months % 12;
  const timeStr = years > 0 ? `${years}y ${remainMonths}m` : `${months} months`;
  
  document.getElementById('months').textContent = timeStr;
  document.getElementById('contributed').textContent = '$' + totalContributed.toLocaleString(undefined, {maximumFractionDigits:0});
  document.getElementById('interest').textContent = '$' + Math.max(0, interestEarned).toLocaleString(undefined, {maximumFractionDigits:0});
  document.getElementById('final').textContent = '$' + balance.toLocaleString(undefined, {maximumFractionDigits:0});
  document.getElementById('results').style.display = 'grid'
}
</script>
