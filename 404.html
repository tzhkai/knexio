<head>

  <link rel="canonical" href="https://knexio.xyz/404.html">
  <style>
    :root {
      --bg: #080c18;
      --card: #0f1629;
      --border: rgba(79, 140, 255, 0.12);
      --text: #e8edf8;
      --sub: #6b7fa3;
      --accent: #4f8cff;
      --accent2: #7c5cfc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Stars background ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.2; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.4); }
    }

    /* ── Floating astronaut ── */
    .astronaut {
      position: relative;
      width: 120px;
      height: 160px;
      margin-bottom: 16px;
      animation: float 4s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%       { transform: translateY(-18px) rotate(4deg); }
    }

    /* ── Orbit ring ── */
    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 1.5px dashed rgba(79, 140, 255, 0.2);
      border-radius: 50%;
      animation: spin 12s linear infinite;
    }
    .orbit-dot {
      position: absolute;
      top: -5px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ── Suit body ── */
    .suit {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 80px;
      background: linear-gradient(160deg, #e8edf8 0%, #c8d4e8 100%);
      border-radius: 32px 32px 20px 20px;
      box-shadow: 0 4px 20px rgba(79,140,255,0.2), inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .suit::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: linear-gradient(160deg, #1a2a4a 0%, #0d1828 100%);
      border-radius: 50%;
      border: 3px solid #3a5a9a;
    }
    /* visor reflection */
    .suit::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 14px;
      width: 12px;
      height: 12px;
      background: rgba(79,140,255,0.4);
      border-radius: 50%;
    }
    /* Backpack */
    .backpack {
      position: absolute;
      top: 46px;
      right: 10px;
      width: 26px;
      height: 56px;
      background: linear-gradient(160deg, #d8e2f0, #b0bcd0);
      border-radius: 6px;
    }
    .backpack::before,
    .backpack::after {
      content: '';
      position: absolute;
      left: 4px;
      width: 18px;
      height: 5px;
      background: #8898b8;
      border-radius: 2px;
    }
    .backpack::before { top: 10px; }
    .backpack::after  { top: 22px; }
    /* Legs */
    .legs {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }
    .leg {
      width: 24px;
      height: 32px;
      background: linear-gradient(160deg, #d8e2f0, #b0bcd0);
      border-radius: 6px 6px 10px 10px;
    }
    /* Helmet */
    .helmet {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 72px;
      background: linear-gradient(160deg, #e8edf8 0%, #c8d4e8 100%);
      border-radius: 50%;
      border: 3px solid #3a5a9a;
      box-shadow: 0 0 24px rgba(79,140,255,0.25), inset 0 1px 0 rgba(255,255,255,0.7);
    }
    /* Helmet visor */
    .helmet::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 10px;
      width: 48px;
      height: 36px;
      background: linear-gradient(160deg, #0d1e3a, #1a3058);
      border-radius: 24px 24px 16px 16px;
      border: 2px solid #2a4a8a;
    }
    /* Visor glare */
    .helmet::after {
      content: '';
      position: absolute;
      top: 18px;
      left: 16px;
      width: 14px;
      height: 10px;
      background: rgba(79,140,255,0.5);
      border-radius: 50%;
      filter: blur(3px);
    }
    /* Arms */
    .arm {
      position: absolute;
      top: 50px;
      width: 22px;
      height: 50px;
      background: linear-gradient(160deg, #d8e2f0, #b0bcd0);
      border-radius: 11px;
    }
    .arm.l { left: 8px;  transform: rotate(18deg); }
    .arm.r { right: 8px; transform: rotate(-18deg); }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
      padding: 0 24px;
    }

    .code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
      text-shadow: none;
    }

    .msg {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .sub {
      font-size: 15px;
      color: var(--sub);
      margin-bottom: 32px;
      line-height: 1.6;
    }


    /* ── Quick links ── */
    .quick {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .quick a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }
    .quick a:hover {
      border-color: var(--accent);
      background: rgba(79,140,255,0.08);
      transform: translateY(-2px);
    }
    .quick .icon {
      font-size: 16px;
    }

    /* ── Ad ── */
    .ad-wrap {
      margin: 0 auto 28px;
      max-width: 500px;
    }

    /* ── Meteor shower ── */
    .meteor {
      position: fixed;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.4);
      animation: meteor var(--dur, 2s) linear infinite;
      opacity: 0;
    }
    @keyframes meteor {
      0%   { transform: translateX(0) translateY(0); opacity: 0; }
      5%   { opacity: 1; }
      30%  { opacity: 1; transform: translateX(-200px) translateY(200px); }
      100% { opacity: 0; transform: translateX(-400px) translateY(400px); }
    }
  </style>

</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Meteors -->
<div class="meteor" style="top:15%;left:80%;--dur:3.2s;animation-delay:0s"></div>
<div class="meteor" style="top:35%;left:90%;--dur:4.5s;animation-delay:1.4s"></div>
<div class="meteor" style="top:65%;left:85%;--dur:3.8s;animation-delay:2.6s"></div>
<div class="meteor" style="top:55%;left:75%;--dur:2.8s;animation-delay:0.8s"></div>

<!-- Main content -->
<div class="content">

  <!-- Astronaut SVG -->
  <div class="astronaut" aria-label="Lost astronaut illustration">
    <div class="orbit"><div class="orbit-dot"></div></div>
    <div class="helmet"></div>
    <div class="suit"></div>
    <div class="backpack"></div>
    <div class="arm l"></div>
    <div class="arm r"></div>
    <div class="legs"><div class="leg"></div><div class="leg"></div></div>
  </div>

  <div class="code">404</div>
  <div class="msg">Lost in Space 🚀</div>
  <div class="sub">
    This page drifted off into the cosmos.<br>
    Let's get you back on course.
  </div>

<div class="quick">

  </div>

  <!-- AdSense -->

  </div>

</div>

<script>
  // ── Generate stars ──
  (function () {
    const container = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() < 0.7 ? Math.random() * 2 + 1 : Math.random() * 3 + 2;
      s.style.cssText = [
        'width:' + size + 'px',
        'height:' + size + 'px',
        'top:' + (Math.random() * 100) + '%',
        'left:' + (Math.random() * 100) + '%',
        '--d:' + (Math.random() * 3 + 1.5) + 's',
        'animation-delay:' + (Math.random() * 4) + 's'
      ].join(';');
      container.appendChild(s);
    }
  })();

</script>
